<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Knight Web Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9670;</text></svg>">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; position: relative; }
  .nf-code {
    font-size: clamp(5rem, 18vw, 10rem); font-weight: 800; line-height: 1; letter-spacing: -.05em;
    background: linear-gradient(120deg, var(--brand-soft), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nf p { color: var(--muted); max-width: 34em; margin-inline: auto; }
  .nf .btn { margin-top: 1.4rem; }
</style>
</head>
<body>
<main class="nf">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="container">
    <p class="nf-code">404</p>
    <h1>This page has moved on</h1>
    <p>The link is broken or the page no longer exists. Head back to the homepage — or tell us what you were looking for and we'll point you at it.</p>
    <a class="btn btn-primary" href="/">Back to homepage</a>
  </div>
</main>
</body>
</html>
