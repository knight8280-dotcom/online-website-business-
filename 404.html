<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<script>
/* Match the theme chosen on the homepage before first paint. */
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
  if (!t && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
  if (t) document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .nf { min-height: calc(100vh - 76px); display: grid; place-items: center; text-align: center; position: relative; }

    font-size: clamp(5rem, 18vw, 10rem); font-weight: 800; line-height: 1; letter-spacing: -.05em;
    background: linear-gradient(120deg, var(--brand-soft), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nf p { color: var(--muted); max-width: 34em; margin-inline: auto; }
  .nf .btn { margin-top: 1.4rem; }
</style>
</head>

    </div>
  </div>
</header>

<main class="nf">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="container">
    <p class="nf-code">404</p>
